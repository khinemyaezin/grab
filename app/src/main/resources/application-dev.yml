server:
  forward-headers-strategy: framework

spring:
  mvc:
    async:
      request-timeout: 360000
  flyway:
    baseline-on-migrate: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}

merchandising:
  datasource:
    url: ${MERCHANDISING_DB_URL:jdbc:postgresql://localhost:5432/product_merchandising}
    username: ${MERCHANDISING_DB_USERNAME:admin}
    password: ${MERCHANDISING_DB_PASSWORD:123}
    driver-class-name: ${MERCHANDISING_DB_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: MerchandisingHikariPool
      maximum-pool-size: ${MERCHANDISING_HIKARI_MAXIMUM_POOL_SIZE:15}
      minimum-idle: ${MERCHANDISING_HIKARI_MINIMUM_IDLE:3}
      connection-timeout: ${MERCHANDISING_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${MERCHANDISING_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${MERCHANDISING_HIKARI_MAX_LIFETIME:1800000}

checkout:
  datasource:
    url: ${CHECKOUT_DB_URL:jdbc:postgresql://localhost:5432/order_management}
    username: ${CHECKOUT_DB_USERNAME:admin}
    password: ${CHECKOUT_DB_PASSWORD:123}
    driver-class-name: ${CHECKOUT_DB_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: CheckoutHikariPool
      maximum-pool-size: ${CHECKOUT_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${CHECKOUT_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${CHECKOUT_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${CHECKOUT_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${CHECKOUT_HIKARI_MAX_LIFETIME:1800000}

account:
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/identity_account}
    username: ${ACCOUNT_DB_USERNAME:admin}
    password: ${ACCOUNT_DB_PASSWORD:123}
    driver-class-name: ${ACCOUNT_DB_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: AccountHikariPool
      maximum-pool-size: ${ACCOUNT_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${ACCOUNT_HIKARI_MIN_IDLE:2}
      connection-timeout: ${ACCOUNT_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${ACCOUNT_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${ACCOUNT_HIKARI_MAX_LIFETIME:1800000}

channel:
  datasource:
    url: ${CHANNEL_DB_URL:jdbc:postgresql://localhost:5432/channel_context}
    username: ${CHANNEL_DB_USERNAME:admin}
    password: ${CHANNEL_DB_PASSWORD:123}
    driver-class-name: ${CHANNEL_DB_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: ChannelHikariPool
      maximum-pool-size: ${CHANNEL_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${CHANNEL_HIKARI_MIN_IDLE:2}
      connection-timeout: ${CHANNEL_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${CHANNEL_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${CHANNEL_HIKARI_MAX_LIFETIME:1800000}

catalog:
  seed:
    enabled: ${CATALOG_SEED_ENABLED:true}
  datasource:
    url: ${CATALOG_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_merchandising}
    username: ${CATALOG_DATASOURCE_USERNAME:admin}
    password: ${CATALOG_DATASOURCE_PASSWORD:123}
    driver-class-name: ${CATALOG_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${CATALOG_HIKARI_MAX_POOL_SIZE:${HIKARI_MAX_POOL_SIZE:10}}
      minimum-idle: ${CATALOG_HIKARI_MIN_IDLE:${HIKARI_MIN_IDLE:2}}
      pool-name: HikariPool-Catalog
  jpa:
    hibernate:
      dialect: ${CATALOG_DATASOURCE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
      hbm2ddl:
        auto: ${CATALOG_JPA_DDL_AUTO:update}
      show_sql: ${CATALOG_JPA_SHOW_SQL:true}
      format_sql: ${CATALOG_JPA_FORMAT_SQL:true}
      default_schema: ${CATALOG_JPA_DEFAULT_SCHEMA:catalog}
  flyway:
    schemas: catalog
    default-schema: catalog
    table: flyway_schema_history
    locations: classpath:db/migration/catalog
  outbox:
    fixed-delay-ms: ${CATALOG_OUTBOX_FIXED_DELAY_MS:5000}
    cleanup-fixed-delay-ms: ${CATALOG_OUTBOX_CLEANUP_FIXED_DELAY_MS:300000}
    batch-size: ${CATALOG_OUTBOX_BATCH_SIZE:20}
    retry-delay-ms: ${CATALOG_OUTBOX_RETRY_DELAY_MS:30000}
    claim-timeout-ms: ${CATALOG_OUTBOX_CLAIM_TIMEOUT_MS:120000}
    retention-ms: ${CATALOG_OUTBOX_RETENTION_MS:604800000}
    hot-queue:
      enabled: ${CATALOG_OUTBOX_HOT_QUEUE_ENABLED:true}
      workers: ${CATALOG_OUTBOX_HOT_QUEUE_WORKERS:2}
      capacity: ${CATALOG_OUTBOX_HOT_QUEUE_CAPACITY:1000}
      drain-timeout-ms: ${CATALOG_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS:5000}

