spring:
  mvc:
    async:
      request-timeout: 360000
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: store-scheduled-

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true

product-merchandising:
  datasource:
    url: ${PM_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_merchandising}
    username: ${PM_DATASOURCE_USERNAME:admin}
    password: ${PM_DATASOURCE_PASSWORD:123}
    driver-class-name: ${PM_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${PM_HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${PM_HIKARI_MIN_IDLE:5}
      pool-name: HikariPool-ProductMerchandising
      register-mbeans: true
order-management:
  datasource:
    url: ${OM_DATASOURCE_URL:jdbc:postgresql://localhost:5433/order_management}
    username: ${OM_DATASOURCE_USERNAME:admin}
    password: ${OM_DATASOURCE_PASSWORD:123}
    driver-class-name: ${OM_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${OM_HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${OM_HIKARI_MIN_IDLE:5}
      pool-name: HikariPool-OrderManagement
      register-mbeans: true
identity-account:
  datasource:
    url: ${IA_DATASOURCE_URL:jdbc:postgresql://localhost:5434/identity_account}
    username: ${IA_DATASOURCE_USERNAME:admin}
    password: ${IA_DATASOURCE_PASSWORD:123}
    driver-class-name: ${IA_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${IA_HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${IA_HIKARI_MIN_IDLE:3}
      pool-name: HikariPool-IdentityAccount
      register-mbeans: true
channel-context:
  datasource:
    url: ${CHANNEL_CONTEXT_DATASOURCE_URL:jdbc:postgresql://localhost:5435/channel_context}
    username: ${CHANNEL_CONTEXT_DATASOURCE_USERNAME:admin}
    password: ${CHANNEL_CONTEXT_DATASOURCE_PASSWORD:123}
    driver-class-name: ${CHANNEL_CONTEXT_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${CHANNEL_CONTEXT_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${CHANNEL_CONTEXT_HIKARI_MIN_IDLE:2}
      pool-name: HikariPool-ChannelContext
      register-mbeans: true
discovery:
  datasource:
    url: ${DISCOVERY_DATASOURCE_URL:${STOREFRONTQUERY_DATASOURCE_URL:jdbc:postgresql://localhost:5436/discovery}}
    username: ${DISCOVERY_DATASOURCE_USERNAME:${STOREFRONTQUERY_DATASOURCE_USERNAME:admin}}
    password: ${DISCOVERY_DATASOURCE_PASSWORD:${STOREFRONTQUERY_DATASOURCE_PASSWORD:123}}
    driver-class-name: ${DISCOVERY_DATASOURCE_DRIVER_CLASS_NAME:${STOREFRONTQUERY_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}}
    hikari:
      maximum-pool-size: ${DISCOVERY_HIKARI_MAX_POOL_SIZE:25}
      minimum-idle: ${DISCOVERY_HIKARI_MIN_IDLE:5}
      pool-name: HikariPool-DiscoveryProduct
      register-mbeans: true

# Domain DataSource settings are used only when a dedicated pool is explicitly enabled.
# Their URLs and credentials default to the owning cluster so enabling a dedicated pool
# does not silently route to an obsolete per-domain database.
catalog:
  datasource:
    dedicated: ${CATALOG_DATASOURCE_DEDICATED:false}
    url: ${CATALOG_DATASOURCE_URL:${PM_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_merchandising}}
    username: ${CATALOG_DATASOURCE_USERNAME:${PM_DATASOURCE_USERNAME:admin}}
    password: ${CATALOG_DATASOURCE_PASSWORD:${PM_DATASOURCE_PASSWORD:123}}
    driver-class-name: ${CATALOG_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${CATALOG_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${CATALOG_HIKARI_MIN_IDLE:2}
      pool-name: HikariPool-Catalog
  jpa:
    hibernate:
      dialect: ${CATALOG_DATASOURCE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
      hbm2ddl:
        auto: ${CATALOG_JPA_DDL_AUTO:validate}
