spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    async:
      request-timeout: 360000
  task:
    scheduling:
      # >= number of class A (competing worker) jobs + 4 so cleanup/sweep cannot starve outbox pollers.
      pool:
        size: ${SCHEDULER_POOL_SIZE:14}
      thread-name-prefix: app-scheduled-
      shutdown:
        await-termination: true
        await-termination-period: 30s

# Boot-time tasks (scheduling class C). Keep gate-readiness=false for the first rollout, watch the "bootstrap"
# health details / logs, then enable it so a replica stays out of rotation until its required tasks succeed.
bootstrap:
  gate-readiness: ${BOOTSTRAP_GATE_READINESS:false}
  max-attempts: ${BOOTSTRAP_MAX_ATTEMPTS:5}
  initial-backoff: ${BOOTSTRAP_INITIAL_BACKOFF:2s}
  max-backoff: ${BOOTSTRAP_MAX_BACKOFF:30s}
  lock-poll-interval: ${BOOTSTRAP_LOCK_POLL_INTERVAL:2s}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,bootstrap
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:200}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logger:
  backend: ${LOGGER_BACKEND:slf4j}
  fail-on-missing-backend: ${LOGGER_FAIL_ON_MISSING_BACKEND:false}
  file:
    path: ${LOGGER_FILE_PATH:logs}
    name: ${LOGGER_FILE_NAME:app.log}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.web: ${LOGGING_LEVEL_WEB:INFO}
