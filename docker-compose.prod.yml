services:
  # ============================================================================
  # Platform Edge & Ingress
  # ============================================================================
  seller-bff:
    ports:
      - "${SELLER_BFF_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      API_SECURITY: "true"
      LOGGING_LEVEL_ROOT: "${LOGGING_LEVEL_ROOT:-WARN}"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # IAM & Authorization Server
  # ============================================================================
  authorization-server:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  authorization-redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================================
  # Headless Domain Services
  # ============================================================================
  account-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  merchandising-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  channel-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  checkout-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Storage Infrastructure
  # ============================================================================
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  seaweedfs:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
