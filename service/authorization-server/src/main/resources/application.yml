spring:
  application:
    name: authorization-server
  config:
    import:
      - optional:file:./docker/config/authorization-clients.yml
      - optional:file:/app/config/authorization-clients.yml
  datasource:
    url: ${AUTHORIZATION_DB_URL:jdbc:postgresql://localhost:5432/authorization}
    username: ${AUTHORIZATION_DB_USERNAME:authorization_server}
    password: ${AUTHORIZATION_DB_PASSWORD:123}
    hikari:
      schema: ${AUTHORIZATION_DB_SCHEMA:authorization_server}
      maximum-pool-size: ${AUTHORIZATION_DB_POOL_SIZE:12}
      minimum-idle: ${AUTHORIZATION_DB_MIN_IDLE:2}
      connection-timeout: ${AUTHORIZATION_DB_TIMEOUT_MS:3000}
      idle-timeout: ${AUTHORIZATION_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${AUTHORIZATION_DB_MAX_LIFETIME_MS:1800000}
  flyway:
    default-schema: ${AUTHORIZATION_DB_SCHEMA:authorization_server}
    schemas: ${AUTHORIZATION_DB_SCHEMA:authorization_server}
    locations: classpath:db/migration/authorization
    clean-disabled: true
  data:
    redis:
      url: ${AUTHORIZATION_REDIS_URL:redis://localhost:6379}
  session:
    timeout: ${AUTHORIZATION_SESSION_TIMEOUT:7d}
    redis:
      namespace: ${AUTHORIZATION_SESSION_NAMESPACE:grab:issuer:sessions}
      repository-type: indexed

server:
  port: ${AUTHORIZATION_PORT:9000}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    session:
      cookie:
        name: ${AUTHORIZATION_SESSION_COOKIE_NAME:GRAB_ISSUER_SESSION}
        http-only: true
        secure: ${AUTHORIZATION_SECURE_COOKIES:true}
        same-site: ${AUTHORIZATION_SESSION_COOKIE_SAME_SITE:lax}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE:health,prometheus,metrics}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      group:
        readiness:
          include: readinessState,db,redis

grab:
  authorization-server:
    issuer: ${AUTHORIZATION_ISSUER:http://localhost:9000}
    access-token-ttl: ${AUTHORIZATION_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${AUTHORIZATION_REFRESH_TOKEN_TTL:P7D}
    cleanup-delay: ${AUTHORIZATION_CLEANUP_DELAY:PT1H}
    account-host: ${AUTHORIZATION_ACCOUNT_HOST:localhost}
    account-port: ${AUTHORIZATION_ACCOUNT_PORT:1199}
    account-connect-timeout: ${AUTHORIZATION_CONNECT_TIMEOUT_MS:1500}
    account-read-timeout: ${AUTHORIZATION_READ_TIMEOUT_MS:3000}
    rate-limit-max-attempts: ${AUTHORIZATION_RATE_LIMIT_MAX:30}
    rate-limit-window-seconds: ${AUTHORIZATION_RATE_LIMIT_WINDOW_SECONDS:60}
    token-retention: ${AUTHORIZATION_TOKEN_RETENTION:P1D}
    client-init-advisory-lock: ${AUTHORIZATION_CLIENT_INIT_ADVISORY_LOCK:6021278}
    key-store: ${AUTHORIZATION_SIGNING_KEYSTORE:}
    key-store-password: ${AUTHORIZATION_SIGNING_PASSWORD:}
    signing-alias: ${AUTHORIZATION_SIGNING_ALIAS:issuer-current}
    retiring-aliases: ${AUTHORIZATION_RETIRING_ALIASES:}
    account-client-key-store: ${AUTHORIZATION_CLIENT_KEYSTORE:}
    account-client-key-password: ${AUTHORIZATION_CLIENT_KEY_PASSWORD:}
    account-trust-store: ${AUTHORIZATION_CLIENT_TRUSTSTORE:}
    account-trust-password: ${AUTHORIZATION_CLIENT_TRUST_PASSWORD:}
