spring:
  application:
    name: authorization-server
  datasource:
    url: ${AUTHORIZATION_DB_URL}
    username: ${AUTHORIZATION_DB_USERNAME}
    password: ${AUTHORIZATION_DB_PASSWORD}
    hikari:
      schema: authorization_server
      maximum-pool-size: ${AUTHORIZATION_DB_POOL_SIZE:12}
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    default-schema: authorization_server
    schemas: authorization_server
    locations: classpath:db/migration/authorization
    clean-disabled: true
  data:
    redis:
      url: ${AUTHORIZATION_REDIS_URL:redis://localhost:6379}
  session:
    timeout: 7d
    redis:
      namespace: grab:issuer:sessions
      repository-type: indexed

server:
  port: ${AUTHORIZATION_PORT:9000}
  servlet:
    session:
      cookie:
        name: GRAB_ISSUER_SESSION
        http-only: true
        secure: ${AUTHORIZATION_SECURE_COOKIES:true}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

grab:
  seller-issuer:
    issuer: ${SELLER_OIDC_ISSUER}
    client-id: ${SELLER_OIDC_CLIENT_ID:seller-bff}
    client-secret-hash: ${SELLER_OIDC_CLIENT_SECRET_HASH}
    redirect-uri: ${SELLER_OIDC_CALLBACK}
    post-logout-redirect-uri: ${SELLER_OIDC_POST_LOGOUT_URI}
    audience: ${SELLER_OIDC_AUDIENCE:grab-seller-api}
    access-token-ttl: ${SELLER_OIDC_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${SELLER_OIDC_REFRESH_TOKEN_TTL:P7D}
    account-host: ${SELLER_AUTH_ACCOUNT_HOST:localhost}
    account-port: ${SELLER_AUTH_ACCOUNT_PORT:1199}
    key-store: ${SELLER_OIDC_SIGNING_KEYSTORE}
    key-store-password: ${SELLER_OIDC_SIGNING_PASSWORD}
    signing-alias: ${SELLER_OIDC_SIGNING_ALIAS:seller-current}
    retiring-aliases: ${SELLER_OIDC_RETIRING_ALIASES:}
    account-client-key-store: ${SELLER_AUTH_CLIENT_KEYSTORE:}
    account-client-key-password: ${SELLER_AUTH_CLIENT_KEY_PASSWORD:}
    account-trust-store: ${SELLER_AUTH_CLIENT_TRUSTSTORE:}
    account-trust-password: ${SELLER_AUTH_CLIENT_TRUST_PASSWORD:}
