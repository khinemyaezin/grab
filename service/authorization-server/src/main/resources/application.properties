spring.application.name=authorization-server
spring.config.import=optional:file:./docker/config/authorization-clients.yml,optional:file:/app/config/authorization-clients.yml
spring.datasource.url=${AUTHORIZATION_DB_URL}
spring.datasource.username=${AUTHORIZATION_DB_USERNAME}
spring.datasource.password=${AUTHORIZATION_DB_PASSWORD}
spring.datasource.hikari.schema=${AUTHORIZATION_DB_SCHEMA:authorization_server}
spring.datasource.hikari.maximum-pool-size=${AUTHORIZATION_DB_POOL_SIZE:12}
spring.datasource.hikari.minimum-idle=${AUTHORIZATION_DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${AUTHORIZATION_DB_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${AUTHORIZATION_DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${AUTHORIZATION_DB_MAX_LIFETIME_MS:1800000}
spring.flyway.default-schema=${AUTHORIZATION_DB_SCHEMA:authorization_server}
spring.flyway.schemas=${AUTHORIZATION_DB_SCHEMA:authorization_server}
spring.flyway.locations=classpath:db/migration/authorization
spring.flyway.clean-disabled=true
spring.data.redis.url=${AUTHORIZATION_REDIS_URL:redis://localhost:6379}
spring.session.timeout=${AUTHORIZATION_SESSION_TIMEOUT:7d}
spring.session.redis.namespace=${AUTHORIZATION_SESSION_NAMESPACE:grab:issuer:sessions}
spring.session.redis.repository-type=indexed
server.port=${AUTHORIZATION_PORT:9000}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.name=${AUTHORIZATION_SESSION_COOKIE_NAME:GRAB_ISSUER_SESSION}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${AUTHORIZATION_SECURE_COOKIES:true}
server.servlet.session.cookie.same-site=${AUTHORIZATION_SESSION_COOKIE_SAME_SITE:lax}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSURE:health,prometheus,metrics}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.group.readiness.include=readinessState,db,redis
grab.authorization-server.issuer=${AUTHORIZATION_ISSUER}
grab.authorization-server.access-token-ttl=${AUTHORIZATION_ACCESS_TOKEN_TTL:PT15M}
grab.authorization-server.refresh-token-ttl=${AUTHORIZATION_REFRESH_TOKEN_TTL:P7D}
grab.authorization-server.cleanup-delay=${AUTHORIZATION_CLEANUP_DELAY:PT1H}
grab.authorization-server.account-host=${AUTHORIZATION_ACCOUNT_HOST:localhost}
grab.authorization-server.account-port=${AUTHORIZATION_ACCOUNT_PORT:1199}
grab.authorization-server.account-connect-timeout=${AUTHORIZATION_CONNECT_TIMEOUT_MS:1500}
grab.authorization-server.account-read-timeout=${AUTHORIZATION_READ_TIMEOUT_MS:3000}
grab.authorization-server.rate-limit-max-attempts=${AUTHORIZATION_RATE_LIMIT_MAX:30}
grab.authorization-server.rate-limit-window-seconds=${AUTHORIZATION_RATE_LIMIT_WINDOW_SECONDS:60}
grab.authorization-server.token-retention=${AUTHORIZATION_TOKEN_RETENTION:P1D}
grab.authorization-server.client-init-advisory-lock=${AUTHORIZATION_CLIENT_INIT_ADVISORY_LOCK:6021278}
grab.authorization-server.key-store=${AUTHORIZATION_SIGNING_KEYSTORE}
grab.authorization-server.key-store-password=${AUTHORIZATION_SIGNING_PASSWORD}
grab.authorization-server.signing-alias=${AUTHORIZATION_SIGNING_ALIAS:issuer-current}
grab.authorization-server.retiring-aliases=${AUTHORIZATION_RETIRING_ALIASES:}
grab.authorization-server.account-client-key-store=${AUTHORIZATION_CLIENT_KEYSTORE}
grab.authorization-server.account-client-key-password=${AUTHORIZATION_CLIENT_KEY_PASSWORD}
grab.authorization-server.account-trust-store=${AUTHORIZATION_CLIENT_TRUSTSTORE}
grab.authorization-server.account-trust-password=${AUTHORIZATION_CLIENT_TRUST_PASSWORD}
