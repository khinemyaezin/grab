<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Grab Account</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body class="login-body">
    <main class="login-container">
        <header class="login-header">
            <h1>Create an Account</h1>
            <p>Register directly with Grab IAM</p>
        </header>

        <div th:if="${error}" class="alert alert-error" role="alert" th:text="${error}">
            An error occurred during registration.
        </div>

        <form th:action="@{/register}" method="post" class="login-form">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input"
                       placeholder="you@example.com" autocomplete="email" required autofocus />
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username (optional)</label>
                <input type="text" id="username" name="username" class="form-input"
                       placeholder="Username" autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" id="firstName" name="firstName" class="form-input"
                       placeholder="John" autocomplete="given-name" />
            </div>

            <div class="form-group">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" id="lastName" name="lastName" class="form-input"
                       placeholder="Doe" autocomplete="family-name" />
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input"
                       placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
            </div>

            <button type="submit" class="btn-primary">Register</button>
        </form>

        <footer style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
            Already have an account? <a th:href="@{/login}">Sign in here</a>
        </footer>
    </main>
</body>
</html>
