spring:
  security:
    oauth2:
      client:
        registration:
          seller:
            client-id: ${grab.seller-oidc.client-id}
            client-secret: ${grab.seller-oidc.client-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${grab.seller-oidc.callback}
            scope: openid
            client-name: Seller Central
        provider:
          seller:
            authorization-uri: ${grab.seller-oidc.issuer}/oauth2/authorize
            token-uri: ${grab.seller-oidc.backchannel}/oauth2/token
            jwk-set-uri: ${grab.seller-oidc.backchannel}/oauth2/jwks
  data:
    redis:
      url: ${SELLER_OIDC_REDIS_URL:redis://localhost:6379}
  application:
    name: seller-bff
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
security:
  api:
    cors: ${SECURITY_API_CORS:*}
    cors-allowed-methods: ${SECURITY_API_CORS_ALLOWED_METHODS:GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS}
    cors-allowed-headers: ${SECURITY_API_CORS_ALLOWED_HEADERS:Content-Type,Authorization,X-CSRF-TOKEN}
grab:
  rpc:
    clients:
      account:
        host: ${GRAB_RPC_CLIENTS_ACCOUNT_HOST:localhost}
        port: ${GRAB_RPC_CLIENTS_ACCOUNT_PORT:1099}
      merchandising:
        host: ${GRAB_RPC_CLIENTS_MERCHANDISING_HOST:localhost}
        port: ${GRAB_RPC_CLIENTS_MERCHANDISING_PORT:1100}
      channel:
        host: ${GRAB_RPC_CLIENTS_CHANNEL_HOST:localhost}
        port: ${GRAB_RPC_CLIENTS_CHANNEL_PORT:1101}

  seller-oidc:
    issuer: ${SELLER_OIDC_ISSUER:}
    backchannel: ${SELLER_OIDC_BACKCHANNEL:${grab.seller-oidc.issuer}}
    audience: ${SELLER_OIDC_AUDIENCE:grab-seller-api}
    client-id: ${SELLER_OIDC_CLIENT_ID:seller-bff}
    client-secret: ${SELLER_OIDC_CLIENT_SECRET:}
    callback: ${SELLER_OIDC_CALLBACK:}
    ui: ${SELLER_OIDC_UI:}
    post-logout: ${SELLER_OIDC_POST_LOGOUT_URI:}
    account-host: ${SELLER_AUTH_ACCOUNT_HOST:localhost}
    registration-port: ${SELLER_AUTH_REGISTRATION_PORT:1200}
    secure-cookies: ${SELLER_OIDC_SECURE_COOKIES:true}
    cookie-name: ${SELLER_OIDC_COOKIE_NAME:GRAB_SELLER_SESSION}
    redis-namespace: ${SELLER_OIDC_REDIS_NAMESPACE:grab:seller}
    session-timeout: ${SELLER_OIDC_SESSION_TIMEOUT:7d}
    connect-timeout: ${SELLER_OIDC_CONNECT_TIMEOUT:2s}
    read-timeout: ${SELLER_OIDC_READ_TIMEOUT:6s}
    revocation-retry-delay: ${SELLER_OIDC_REVOCATION_RETRY_DELAY:30s}
    revocation-token-ttl: ${SELLER_OIDC_REVOCATION_TOKEN_TTL:7d}
    revocation-claim-lease: ${SELLER_OIDC_REVOCATION_CLAIM_LEASE:60s}
    revocation-batch-size: ${SELLER_OIDC_REVOCATION_BATCH_SIZE:25}
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
