spring:
  config:
    import: optional:configtree:/run/secrets/seller-bff/
  security:
    oauth2:
      client:
        registration:
          seller:
            client-id: ${grab.seller-oidc.client-id}
            client-secret: ${grab.seller-oidc.client-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${grab.seller-oidc.callback}
            scope: ${grab.seller-oidc.scopes}
            client-name: Seller Central
  data:
    redis:
      url: ${SELLER_OIDC_REDIS_URL:}
      username: ${SELLER_OIDC_REDIS_USERNAME:}
      password: ${SELLER_OIDC_REDIS_PASSWORD:}
      ssl:
        enabled: ${SELLER_OIDC_REDIS_SSL:false}
  application:
    name: seller-bff
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
security:
  api:
    cors: ${SECURITY_API_CORS:*}
    cors-allowed-methods: ${SECURITY_API_CORS_ALLOWED_METHODS:GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS}
    cors-allowed-headers: ${SECURITY_API_CORS_ALLOWED_HEADERS:Content-Type,Authorization,X-CSRF-TOKEN}
grab:
  rpc:
    clients:
      account:
        host: ${GRAB_RPC_CLIENTS_ACCOUNT_HOST:localhost}
        port: ${GRAB_RPC_CLIENTS_ACCOUNT_PORT:1099}
      merchandising:
        host: ${GRAB_RPC_CLIENTS_MERCHANDISING_HOST:localhost}
        port: ${GRAB_RPC_CLIENTS_MERCHANDISING_PORT:1100}
      channel:
        host: ${GRAB_RPC_CLIENTS_CHANNEL_HOST:localhost}
        port: ${GRAB_RPC_CLIENTS_CHANNEL_PORT:1101}

  seller-oidc:
    issuer: ${SELLER_OIDC_ISSUER:}
    audience: ${SELLER_OIDC_AUDIENCE:}
    scopes: ${SELLER_OIDC_SCOPES:openid,profile,email}
    client-id: ${SELLER_OIDC_CLIENT_ID:}
    client-secret: ${SELLER_OIDC_CLIENT_SECRET:}
    resource-client-id: ${SELLER_OIDC_RESOURCE_CLIENT_ID:${SELLER_OIDC_CLIENT_ID:seller-bff}}
    resource-client-secret: ${SELLER_OIDC_RESOURCE_CLIENT_SECRET:${SELLER_OIDC_CLIENT_SECRET:}}
    callback: ${SELLER_OIDC_CALLBACK:}
    ui: ${SELLER_OIDC_UI:}
    post-logout: ${SELLER_OIDC_POST_LOGOUT_URI:}
    metadata-uri: ${GRAB_SELLER_OIDC_METADATA_URI:}
    token-endpoint: ${GRAB_SELLER_OIDC_TOKEN_ENDPOINT:}
    jwk-set-endpoint: ${GRAB_SELLER_OIDC_JWK_SET_ENDPOINT:}
    user-info-endpoint: ${GRAB_SELLER_OIDC_USER_INFO_ENDPOINT:}
    introspection-endpoint: ${GRAB_SELLER_OIDC_INTROSPECTION_ENDPOINT:}
    revocation-endpoint: ${GRAB_SELLER_OIDC_REVOCATION_ENDPOINT:}
    logout-endpoint: ${GRAB_SELLER_OIDC_LOGOUT_ENDPOINT:}
    account-host: ${SELLER_AUTH_ACCOUNT_HOST:account-service}
    registration-port: ${SELLER_AUTH_REGISTRATION_PORT:1200}
    account-key-store: ${SELLER_AUTH_CLIENT_KEYSTORE:/run/secrets/seller-auth/client.p12}
    account-key-password: ${SELLER_AUTH_CLIENT_KEY_PASSWORD:}
    account-trust-store: ${SELLER_AUTH_CLIENT_TRUSTSTORE:/run/secrets/seller-auth/account-trust.p12}
    account-trust-password: ${SELLER_AUTH_CLIENT_TRUST_PASSWORD:}
    account-connect-timeout: ${SELLER_AUTH_CONNECT_TIMEOUT:2s}
    account-read-timeout: ${SELLER_AUTH_READ_TIMEOUT:6s}
    secure-cookies: ${SELLER_OIDC_SECURE_COOKIES:true}
    cookie-name: ${SELLER_OIDC_COOKIE_NAME:GRAB_SELLER_SESSION}
    redis-namespace: ${SELLER_OIDC_REDIS_NAMESPACE:grab:seller}
    session-timeout: ${SELLER_OIDC_SESSION_TIMEOUT:7d}
    connect-timeout: ${SELLER_OIDC_CONNECT_TIMEOUT:2s}
    read-timeout: ${SELLER_OIDC_READ_TIMEOUT:6s}
    refresh-skew: ${SELLER_OIDC_REFRESH_SKEW:5s}
    lock-ttl: ${SELLER_OIDC_LOCK_TTL:30s}
    revocation-retry-delay: ${SELLER_OIDC_REVOCATION_RETRY_DELAY:30s}
    revocation-token-ttl: ${SELLER_OIDC_REVOCATION_TOKEN_TTL:7d}
    revocation-claim-lease: ${SELLER_OIDC_REVOCATION_CLAIM_LEASE:60s}
    revocation-batch-size: ${SELLER_OIDC_REVOCATION_BATCH_SIZE:25}
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
