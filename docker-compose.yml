services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${DEBUG_PORT:-5005}:5005"
    depends_on:
      product-merchandising-db:
        condition: service_healthy
      order-management-db:
        condition: service_healthy
      identity-account-db:
        condition: service_healthy
      channel-context-db:
        condition: service_healthy
      discovery-db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      PM_DATASOURCE_URL: "${PM_DATASOURCE_URL:-jdbc:postgresql://product-merchandising-db:5432/product_merchandising}"
