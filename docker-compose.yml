services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grab-store-dev
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${DEBUG_PORT:-5005}:5005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      CATALOG_DATASOURCE_URL: "${CATALOG_DATASOURCE_URL:?CATALOG_DATASOURCE_URL is required}"
      CATALOG_DATASOURCE_USERNAME: "${CATALOG_DATASOURCE_USERNAME:?CATALOG_DATASOURCE_USERNAME is required}"
      CATALOG_DATASOURCE_PASSWORD: "${CATALOG_DATASOURCE_PASSWORD:?CATALOG_DATASOURCE_PASSWORD is required}"
      CATALOG_DATASOURCE_DIALECT: "${CATALOG_DATASOURCE_DIALECT:?CATALOG_DATASOURCE_DIALECT is required}"
      CATALOG_DATASOURCE_DRIVER_CLASS_NAME: "${CATALOG_DATASOURCE_DRIVER_CLASS_NAME:?CATALOG_DATASOURCE_DRIVER_CLASS_NAME is required}"
      CATALOG_SEED_ENABLED: "${CATALOG_SEED_ENABLED:-true}"
      CATALOG_JPA_DDL_AUTO: "${CATALOG_JPA_DDL_AUTO:-update}"
      CATALOG_JPA_SHOW_SQL: "${CATALOG_JPA_SHOW_SQL:-false}"
      CATALOG_JPA_FORMAT_SQL: "${CATALOG_JPA_FORMAT_SQL:-false}"
      CATALOG_OUTBOX_HOT_QUEUE_ENABLED: "${CATALOG_OUTBOX_HOT_QUEUE_ENABLED:-true}"
      CATALOG_OUTBOX_HOT_QUEUE_WORKERS: "${CATALOG_OUTBOX_HOT_QUEUE_WORKERS:-2}"
      CATALOG_OUTBOX_HOT_QUEUE_CAPACITY: "${CATALOG_OUTBOX_HOT_QUEUE_CAPACITY:-1000}"
      CATALOG_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS: "${CATALOG_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS:-5000}"
      INVENTORY_DATASOURCE_URL: "${INVENTORY_DATASOURCE_URL:?INVENTORY_DATASOURCE_URL is required}"
      INVENTORY_DATASOURCE_USERNAME: "${INVENTORY_DATASOURCE_USERNAME:?INVENTORY_DATASOURCE_USERNAME is required}"
      INVENTORY_DATASOURCE_PASSWORD: "${INVENTORY_DATASOURCE_PASSWORD:?INVENTORY_DATASOURCE_PASSWORD is required}"
      INVENTORY_DATASOURCE_DIALECT: "${INVENTORY_DATASOURCE_DIALECT:?INVENTORY_DATASOURCE_DIALECT is required}"
      INVENTORY_DATASOURCE_DRIVER_CLASS_NAME: "${INVENTORY_DATASOURCE_DRIVER_CLASS_NAME:?INVENTORY_DATASOURCE_DRIVER_CLASS_NAME is required}"
      INVENTORY_JPA_DDL_AUTO: "${INVENTORY_JPA_DDL_AUTO:-update}"
      INVENTORY_JPA_SHOW_SQL: "${INVENTORY_JPA_SHOW_SQL:-false}"
      INVENTORY_JPA_FORMAT_SQL: "${INVENTORY_JPA_FORMAT_SQL:-false}"
      INVENTORY_SEED_ENABLED: "${INVENTORY_SEED_ENABLED:-true}"
      INVENTORY_OUTBOX_HOT_QUEUE_ENABLED: "${INVENTORY_OUTBOX_HOT_QUEUE_ENABLED:-true}"
      INVENTORY_OUTBOX_HOT_QUEUE_WORKERS: "${INVENTORY_OUTBOX_HOT_QUEUE_WORKERS:-2}"
      INVENTORY_OUTBOX_HOT_QUEUE_CAPACITY: "${INVENTORY_OUTBOX_HOT_QUEUE_CAPACITY:-1000}"
      INVENTORY_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS: "${INVENTORY_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS:-5000}"
      IDENTITY_ADMIN_EMAIL: "${IDENTITY_ADMIN_EMAIL:-admin@example.com}"
      IDENTITY_ADMIN_PASSWORD: "${IDENTITY_ADMIN_PASSWORD:-change-me-admin}"
      IDENTITY_DATASOURCE_URL: "${IDENTITY_DATASOURCE_URL:?IDENTITY_DATASOURCE_URL is required}"
      IDENTITY_DATASOURCE_USERNAME: "${IDENTITY_DATASOURCE_USERNAME:?IDENTITY_DATASOURCE_USERNAME is required}"
      IDENTITY_DATASOURCE_PASSWORD: "${IDENTITY_DATASOURCE_PASSWORD:?IDENTITY_DATASOURCE_PASSWORD is required}"
      IDENTITY_DATASOURCE_DIALECT: "${IDENTITY_DATASOURCE_DIALECT:?IDENTITY_DATASOURCE_DIALECT is required}"
      IDENTITY_DATASOURCE_DRIVER_CLASS_NAME: "${IDENTITY_DATASOURCE_DRIVER_CLASS_NAME:?IDENTITY_DATASOURCE_DRIVER_CLASS_NAME is required}"
      IDENTITY_JPA_DDL_AUTO: "${IDENTITY_JPA_DDL_AUTO:-update}"
      IDENTITY_SEED_ENABLED: "${IDENTITY_SEED_ENABLED:-true}"
      IDENTITY_OUTBOX_HOT_QUEUE_ENABLED: "${IDENTITY_OUTBOX_HOT_QUEUE_ENABLED:-true}"
      IDENTITY_OUTBOX_HOT_QUEUE_WORKERS: "${IDENTITY_OUTBOX_HOT_QUEUE_WORKERS:-2}"
      IDENTITY_OUTBOX_HOT_QUEUE_CAPACITY: "${IDENTITY_OUTBOX_HOT_QUEUE_CAPACITY:-1000}"
      IDENTITY_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS: "${IDENTITY_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS:-5000}"
      MERCHANT_ENABLED: "${MERCHANT_ENABLED:-true}"
      MERCHANT_DATASOURCE_URL: "${MERCHANT_DATASOURCE_URL:?MERCHANT_DATASOURCE_URL is required}"
      MERCHANT_DATASOURCE_USERNAME: "${MERCHANT_DATASOURCE_USERNAME:?MERCHANT_DATASOURCE_USERNAME is required}"
      MERCHANT_DATASOURCE_PASSWORD: "${MERCHANT_DATASOURCE_PASSWORD:?MERCHANT_DATASOURCE_PASSWORD is required}"
      MERCHANT_DATASOURCE_DIALECT: "${MERCHANT_DATASOURCE_DIALECT:?MERCHANT_DATASOURCE_DIALECT is required}"
      MERCHANT_DATASOURCE_DRIVER_CLASS_NAME: "${MERCHANT_DATASOURCE_DRIVER_CLASS_NAME:?MERCHANT_DATASOURCE_DRIVER_CLASS_NAME is required}"
      MERCHANT_JPA_DDL_AUTO: "${MERCHANT_JPA_DDL_AUTO:-validate}"
      MERCHANT_OUTBOX_HOT_QUEUE_ENABLED: "${MERCHANT_OUTBOX_HOT_QUEUE_ENABLED:-true}"
      MERCHANT_OUTBOX_HOT_QUEUE_WORKERS: "${MERCHANT_OUTBOX_HOT_QUEUE_WORKERS:-2}"
      MERCHANT_OUTBOX_HOT_QUEUE_CAPACITY: "${MERCHANT_OUTBOX_HOT_QUEUE_CAPACITY:-1000}"
      MERCHANT_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS: "${MERCHANT_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS:-5000}"
      PRICING_ENABLED: "${PRICING_ENABLED:-true}"
      PRICING_DATASOURCE_URL: "${PRICING_DATASOURCE_URL:?PRICING_DATASOURCE_URL is required}"
      PRICING_DATASOURCE_USERNAME: "${PRICING_DATASOURCE_USERNAME:?PRICING_DATASOURCE_USERNAME is required}"
      PRICING_DATASOURCE_PASSWORD: "${PRICING_DATASOURCE_PASSWORD:?PRICING_DATASOURCE_PASSWORD is required}"
      PRICING_DATASOURCE_DIALECT: "${PRICING_DATASOURCE_DIALECT:?PRICING_DATASOURCE_DIALECT is required}"
      PRICING_DATASOURCE_DRIVER_CLASS_NAME: "${PRICING_DATASOURCE_DRIVER_CLASS_NAME:?PRICING_DATASOURCE_DRIVER_CLASS_NAME is required}"
      PRICING_JPA_DDL_AUTO: "${PRICING_JPA_DDL_AUTO:-validate}"
      PRICING_JPA_SHOW_SQL: "${PRICING_JPA_SHOW_SQL:-false}"
      PRICING_JPA_FORMAT_SQL: "${PRICING_JPA_FORMAT_SQL:-false}"
      PRICING_OUTBOX_HOT_QUEUE_ENABLED: "${PRICING_OUTBOX_HOT_QUEUE_ENABLED:-true}"
      PRICING_OUTBOX_HOT_QUEUE_WORKERS: "${PRICING_OUTBOX_HOT_QUEUE_WORKERS:-2}"
      PRICING_OUTBOX_HOT_QUEUE_CAPACITY: "${PRICING_OUTBOX_HOT_QUEUE_CAPACITY:-1000}"
      PRICING_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS: "${PRICING_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS:-5000}"
      WORKFLOW_SEED_ENABLED: "${WORKFLOW_SEED_ENABLED:-true}"
      WORKFLOWS_DATASOURCE_URL: "${WORKFLOWS_DATASOURCE_URL:?WORKFLOWS_DATASOURCE_URL is required}"
      WORKFLOWS_DATASOURCE_USERNAME: "${WORKFLOWS_DATASOURCE_USERNAME:?WORKFLOWS_DATASOURCE_USERNAME is required}"
      WORKFLOWS_DATASOURCE_PASSWORD: "${WORKFLOWS_DATASOURCE_PASSWORD:?WORKFLOWS_DATASOURCE_PASSWORD is required}"
      WORKFLOWS_DATASOURCE_DIALECT: "${WORKFLOWS_DATASOURCE_DIALECT:?WORKFLOWS_DATASOURCE_DIALECT is required}"
      WORKFLOWS_DATASOURCE_DRIVER_CLASS_NAME: "${WORKFLOWS_DATASOURCE_DRIVER_CLASS_NAME:?WORKFLOWS_DATASOURCE_DRIVER_CLASS_NAME is required}"
      WORKFLOWS_JPA_DDL_AUTO: "${WORKFLOWS_JPA_DDL_AUTO:-update}"
      WORKFLOWS_JPA_SHOW_SQL: "${WORKFLOWS_JPA_SHOW_SQL:-false}"
      WORKFLOWS_JPA_FORMAT_SQL: "${WORKFLOWS_JPA_FORMAT_SQL:-false}"
      WORKFLOWS_SWEEPER_FIXED_DELAY_MS: "${WORKFLOWS_SWEEPER_FIXED_DELAY_MS:-30000}"
      WORKFLOWS_OUTBOX_HOT_QUEUE_ENABLED: "${WORKFLOWS_OUTBOX_HOT_QUEUE_ENABLED:-true}"
      WORKFLOWS_OUTBOX_HOT_QUEUE_WORKERS: "${WORKFLOWS_OUTBOX_HOT_QUEUE_WORKERS:-2}"
      WORKFLOWS_OUTBOX_HOT_QUEUE_CAPACITY: "${WORKFLOWS_OUTBOX_HOT_QUEUE_CAPACITY:-1000}"
      WORKFLOWS_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS: "${WORKFLOWS_OUTBOX_HOT_QUEUE_DRAIN_TIMEOUT_MS:-5000}"
      API_SECURITY: "${API_SECURITY:-true}"
      SECURITY_API_CORES: "${SECURITY_API_CORES:-http://localhost:3000,http://localhost:4000}"
      SECURITY_API_COOKIE_SECURE: "${SECURITY_API_COOKIE_SECURE:-false}"
      SECURITY_API_COOKIE_SAME_SITE: "${SECURITY_API_COOKIE_SAME_SITE:-Lax}"
      SECURITY_API_COOKIE_REFRESH_TOKEN_MAX_AGE_DAYS: "${SECURITY_API_COOKIE_REFRESH_TOKEN_MAX_AGE_DAYS:-7}"
      SECURITY_API_COOKIE_REFRESH_TOKEN_PATH: "${SECURITY_API_COOKIE_REFRESH_TOKEN_PATH:-/api/v1/identity/auth/refresh}"
      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:-PT15M}"
      JWT_REFRESH_TOKEN_TTL: "${JWT_REFRESH_TOKEN_TTL:-P7D}"
      LOGGER_BACKEND: "${LOGGER_BACKEND:-slf4j}"
      LOGGER_FAIL_ON_MISSING_BACKEND: "${LOGGER_FAIL_ON_MISSING_BACKEND:-false}"
      LOGGER_FILE_PATH: "${LOGGER_FILE_PATH:-logs}"
      LOGGER_FILE_NAME: "${LOGGER_FILE_NAME:-store.log}"
      LOGGING_LEVEL_ROOT: "${LOGGING_LEVEL_ROOT:-INFO}"
      LOGGING_LEVEL_WEB: "${LOGGING_LEVEL_WEB:-INFO}"
      STORAGE_S3_ENDPOINT: "${STORAGE_S3_ENDPOINT:-http://s3.localhost:8333}"
      STORAGE_S3_REGION: "${STORAGE_S3_REGION:-us-east-1}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-grab-media}"
      STORAGE_S3_ACCESS_KEY: "${STORAGE_S3_ACCESS_KEY:-s3admin}"
      STORAGE_S3_SECRET_KEY: "${STORAGE_S3_SECRET_KEY:-s3secret}"
      STORAGE_S3_PUBLIC_BASE_URL: "${STORAGE_S3_PUBLIC_BASE_URL:-http://s3.localhost:8333/grab-media}"
      STORAGE_S3_PRESIGN_TTL: "${STORAGE_S3_PRESIGN_TTL:-PT15M}"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005}"

  postgres:
    image: postgres:16-alpine
    container_name: grab-postgres-dev
    environment:
      MODULE_DATABASES: "${MODULE_DATABASES:?MODULE_DATABASES is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: grab-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    container_name: grab-seaweedfs-dev
    profiles: ["storage"]
    command:
      - "server"
      - "-ip=0.0.0.0"
      - "-ip.bind=0.0.0.0"
      - "-dir=/data"
      - "-s3"
      - "-s3.port=8333"
      - "-s3.config=/etc/seaweedfs/s3.json"
      - "-s3.allowedOrigins=http://localhost:3000,http://localhost:4000,http://localhost:5173"
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweed-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      app-network:
        aliases:
          - s3.localhost
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  seaweedfs-init:
    image: amazon/aws-cli:2.22.35
    profiles: ["storage"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://s3.localhost:8333 s3 mb s3://"$${STORAGE_S3_BUCKET:-grab-media}" || true
        aws --endpoint-url http://s3.localhost:8333 s3api head-bucket --bucket "$${STORAGE_S3_BUCKET:-grab-media}"
    environment:
      AWS_ACCESS_KEY_ID: "${STORAGE_S3_ACCESS_KEY:-s3admin}"
      AWS_SECRET_ACCESS_KEY: "${STORAGE_S3_SECRET_KEY:-s3secret}"
      AWS_DEFAULT_REGION: "${STORAGE_S3_REGION:-us-east-1}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-grab-media}"
    networks:
      - app-network

networks:
  app-network:
    name: "${DOCKER_NETWORK:-grab-network}"
    driver: bridge

volumes:
  postgres-data:
    name: "${POSTGRES_VOLUME:-postgres-data}"
  pgadmin-data:
    name: "${PGADMIN_VOLUME:-pgadmin-data}"
  seaweed-data:
    name: "${SEAWEEDFS_VOLUME:-seaweed-data}"
