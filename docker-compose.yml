services:
  # ============================================================================
  # Platform Edge & Ingress
  # ============================================================================
  seller-bff:
    build:
      context: .
      dockerfile: service/seller-bff/Dockerfile
    container_name: grab-seller-bff
    hostname: seller-bff
    depends_on:
      authorization-server:
        condition: service_healthy
      account-service:
        condition: service_started
      merchandising-service:
        condition: service_started
      channel-service:
        condition: service_started
    networks:
      - app-network
    env_file:
      - path: docker/env/seller-bff.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      SERVER_PORT: 8080
      API_SECURITY: "${API_SECURITY:-false}"
      JWT_ISSUER: "${JWT_ISSUER:-https://identity.local.grab}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-grab-commerce-api}"
      SECURITY_API_CORS: "${SECURITY_API_CORS:-http://localhost:3000,http://localhost:5173}"
      GRAB_RPC_CLIENTS_ACCOUNT_HOST: account-service
      GRAB_RPC_CLIENTS_ACCOUNT_PORT: 1099
      GRAB_RPC_CLIENTS_MERCHANDISING_HOST: merchandising-service
      GRAB_RPC_CLIENTS_MERCHANDISING_PORT: 1100
      GRAB_RPC_CLIENTS_CHANNEL_HOST: channel-service
      GRAB_RPC_CLIENTS_CHANNEL_PORT: 1101
      LOGGING_LEVEL_ROOT: "${LOGGING_LEVEL_ROOT:-INFO}"
      SELLER_AUTH_ACCOUNT_HOST: account-service
      SELLER_AUTH_REGISTRATION_PORT: "${SELLER_AUTH_REGISTRATION_PORT:-1200}"
      GRAB_SELLER_OIDC_METADATA_URI: "${AUTHORIZATION_METADATA_URI:-http://authorization-server:9000/.well-known/openid-configuration}"
      GRAB_SELLER_OIDC_TOKEN_ENDPOINT: "${AUTHORIZATION_TOKEN_ENDPOINT:-http://authorization-server:9000/oauth2/token}"
      GRAB_SELLER_OIDC_JWK_SET_ENDPOINT: "${AUTHORIZATION_JWK_SET_ENDPOINT:-http://authorization-server:9000/oauth2/jwks}"
      GRAB_SELLER_OIDC_USER_INFO_ENDPOINT: "${AUTHORIZATION_USERINFO_ENDPOINT:-http://authorization-server:9000/userinfo}"
      GRAB_SELLER_OIDC_INTROSPECTION_ENDPOINT: "${AUTHORIZATION_INTROSPECTION_ENDPOINT:-http://authorization-server:9000/oauth2/introspect}"
      GRAB_SELLER_OIDC_REVOCATION_ENDPOINT: "${AUTHORIZATION_REVOCATION_ENDPOINT:-http://authorization-server:9000/oauth2/revoke}"
      GRAB_SELLER_OIDC_LOGOUT_ENDPOINT: "${AUTHORIZATION_LOGOUT_ENDPOINT:-http://localhost:9000/connect/logout}"
      SELLER_OIDC_REDIS_URL: "${SELLER_COMPOSE_REDIS_URL:-redis://authorization-redis:6379}"
    volumes:
      - ${AUTHORIZATION_SECRETS_DIR:-./docker/secrets/authorization}/bff:/run/secrets/seller-auth:ro
      - ${SELLER_BFF_SECRETS_DIR:-./docker/secrets/authorization/bff}:/run/secrets/seller-bff:ro
    restart: unless-stopped

  # ============================================================================
  # IAM & Authorization Server
  # ============================================================================
  authorization-db-provision:
    image: postgres:16-alpine
    container_name: grab-authorization-db-provision
    entrypoint: ["/bin/sh", "/opt/authorization/provision.sh"]
    env_file:
      - path: docker/env/authorization-server.env
        required: false
    environment:
      PGHOST: postgres
      PGUSER: "${POSTGRES_USER:-admin}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-123}"
      AUTHORIZATION_DB_NAME: "${AUTHORIZATION_DB_NAME:-authorization}"
      AUTHORIZATION_DB_USERNAME: "${AUTHORIZATION_DB_USERNAME:-auth_user}"
      AUTHORIZATION_DB_PASSWORD: "${AUTHORIZATION_DB_PASSWORD:-auth_secret}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./docker/postgres/provision-authorization.sh:/opt/authorization/provision.sh:ro

  authorization-redis:
    image: redis:7-alpine
    container_name: grab-authorization-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - seller-auth-redis:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  authorization-server:
    build:
      context: .
      dockerfile: service/authorization-server/Dockerfile
    container_name: grab-authorization-server
    hostname: authorization-server
    env_file:
      - path: docker/env/authorization-server.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      AUTHORIZATION_ACCOUNT_HOST: account-service
      AUTHORIZATION_ACCOUNT_PORT: "${AUTHORIZATION_ACCOUNT_PORT:-1199}"
      AUTHORIZATION_REDIS_URL: "${AUTHORIZATION_COMPOSE_REDIS_URL:-redis://authorization-redis:6379}"
      AUTHORIZATION_PORT: 9000
      SPRING_CONFIG_IMPORT: file:/app/config/authorization-clients.yml
    depends_on:
      authorization-db-provision:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      account-service:
        condition: service_healthy
      authorization-redis:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - type: bind
        source: ${AUTHORIZATION_CLIENTS_FILE:-./docker/config/authorization-clients.yml}
        target: /app/config/authorization-clients.yml
        read_only: true
        bind:
          create_host_path: false
      - ${AUTHORIZATION_SECRETS_DIR:-./docker/secrets/authorization}/issuer:/run/secrets/issuer:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============================================================================
  # Headless Domain Services
  # ============================================================================
  account-service:
    build:
      context: .
      dockerfile: service/account/account-service/Dockerfile
    container_name: grab-account-service
    hostname: account-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    env_file:
      - path: docker/env/account-service.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      ACCOUNT_DB_URL: "${ACCOUNT_DB_URL:-jdbc:postgresql://identity-account-db:5432/account}"
      ACCOUNT_DB_USERNAME: "${ACCOUNT_DB_USERNAME:-admin}"
      ACCOUNT_DB_PASSWORD: "${ACCOUNT_DB_PASSWORD:-123}"
      ACCOUNT_DB_DRIVER: org.postgresql.Driver
      GRAB_RPC_ENABLED: "${GRAB_RPC_ENABLED:-true}"
      GRAB_RPC_REGISTRY_PORT: 1099
      GRAB_RPC_BIND_ADDRESS: 0.0.0.0
      GRAB_RPC_ADVERTISED_HOST: account-service
      GRAB_RPC_CLIENTS_CHANNEL_HOST: channel-service
      GRAB_RPC_CLIENTS_CHANNEL_PORT: 1101
      JWT_ISSUER: "${JWT_ISSUER:-https://identity.local.grab}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-grab-commerce-api}"
      JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:-PT15M}"
      JWT_REFRESH_TOKEN_TTL: "${JWT_REFRESH_TOKEN_TTL:-P7D}"
      SELLER_AUTH_RPC_ENABLED: "true"
      SELLER_AUTH_ISSUER_PORT: "${AUTHORIZATION_ACCOUNT_PORT:-1199}"
      SELLER_AUTH_REGISTRATION_PORT: "${SELLER_AUTH_REGISTRATION_PORT:-1200}"
    volumes:
      - ${AUTHORIZATION_SECRETS_DIR:-./docker/secrets/authorization}/account:/run/secrets/seller-auth:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 ${AUTHORIZATION_ACCOUNT_PORT:-1199} && nc -z -w 2 127.0.0.1 ${SELLER_AUTH_REGISTRATION_PORT:-1200}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  merchandising-service:
    build:
      context: .
      dockerfile: service/marchendising/merchandising-service/Dockerfile
    container_name: grab-merchandising-service
    hostname: merchandising-service
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - app-network
    env_file:
      - path: docker/env/merchandising-service.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      MERCHANDISING_DB_URL: "${MERCHANDISING_DB_URL:-jdbc:postgresql://product-merchandising-db:5432/merchandising}"
      MERCHANDISING_DB_USERNAME: "${MERCHANDISING_DB_USERNAME:-admin}"
      MERCHANDISING_DB_PASSWORD: "${MERCHANDISING_DB_PASSWORD:-123}"
      MERCHANDISING_DB_DRIVER: org.postgresql.Driver
      STORAGE_S3_ENDPOINT: "${STORAGE_S3_ENDPOINT:-http://s3.localhost:8333}"
      STORAGE_S3_REGION: "${STORAGE_S3_REGION:-us-east-1}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-grab-media}"
      STORAGE_S3_ACCESS_KEY: "${STORAGE_S3_ACCESS_KEY:-s3admin}"
      STORAGE_S3_SECRET_KEY: "${STORAGE_S3_SECRET_KEY:-s3secret}"
      STORAGE_S3_PUBLIC_BASE_URL: "${STORAGE_S3_PUBLIC_BASE_URL:-http://localhost:8333/grab-media}"
      GRAB_RPC_ENABLED: "${GRAB_RPC_ENABLED:-true}"
      GRAB_RPC_REGISTRY_PORT: 1100
      GRAB_RPC_BIND_ADDRESS: 0.0.0.0
      GRAB_RPC_ADVERTISED_HOST: merchandising-service
    restart: unless-stopped

  channel-service:
    build:
      context: .
      dockerfile: service/channel/channel-service/Dockerfile
    container_name: grab-channel-service
    hostname: channel-service
    depends_on:
      postgres:
        condition: service_healthy
      merchandising-service:
        condition: service_started
    networks:
      - app-network
    env_file:
      - path: docker/env/channel-service.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      CHANNEL_DB_URL: "${CHANNEL_DB_URL:-jdbc:postgresql://channel-context-db:5432/channel}"
      CHANNEL_DB_USERNAME: "${CHANNEL_DB_USERNAME:-admin}"
      CHANNEL_DB_PASSWORD: "${CHANNEL_DB_PASSWORD:-123}"
      CHANNEL_DB_DRIVER: org.postgresql.Driver
      GRAB_RPC_ENABLED: "${GRAB_RPC_ENABLED:-true}"
      GRAB_RPC_REGISTRY_PORT: 1101
      GRAB_RPC_BIND_ADDRESS: 0.0.0.0
      GRAB_RPC_ADVERTISED_HOST: channel-service
      GRAB_RPC_CLIENTS_MERCHANDISING_HOST: merchandising-service
      GRAB_RPC_CLIENTS_MERCHANDISING_PORT: 1100
    restart: unless-stopped

  checkout-service:
    build:
      context: .
      dockerfile: service/checkout/checkout-service/Dockerfile
    container_name: grab-checkout-service
    hostname: checkout-service
    depends_on:
      postgres:
        condition: service_healthy
      channel-service:
        condition: service_started
      merchandising-service:
        condition: service_started
    networks:
      - app-network
    env_file:
      - path: docker/env/checkout-service.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      CHECKOUT_DB_URL: "${CHECKOUT_DB_URL:-jdbc:postgresql://order-management-db:5432/checkout}"
      CHECKOUT_DB_USERNAME: "${CHECKOUT_DB_USERNAME:-admin}"
      CHECKOUT_DB_PASSWORD: "${CHECKOUT_DB_PASSWORD:-123}"
      CHECKOUT_DB_DRIVER: org.postgresql.Driver
      GRAB_RPC_ENABLED: "${GRAB_RPC_ENABLED:-true}"
      GRAB_RPC_REGISTRY_PORT: 1102
      GRAB_RPC_BIND_ADDRESS: 0.0.0.0
      GRAB_RPC_ADVERTISED_HOST: checkout-service
      GRAB_RPC_CLIENTS_CHANNEL_HOST: channel-service
      GRAB_RPC_CLIENTS_CHANNEL_PORT: 1101
      GRAB_RPC_CLIENTS_MERCHANDISING_HOST: merchandising-service
      GRAB_RPC_CLIENTS_MERCHANDISING_PORT: 1100
    restart: unless-stopped

  # ============================================================================
  # Storage Infrastructure
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: grab-postgres-dev
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
    environment:
      MODULE_DATABASES: "${MODULE_DATABASES:-merchandising checkout account channel authorization}"
      POSTGRES_USER: "${POSTGRES_USER:-admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app-network:
        aliases:
          - product-merchandising-db
          - order-management-db
          - identity-account-db
          - channel-context-db
          - merchandising-db
          - checkout-db
          - account-db
          - channel-db
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    container_name: grab-seaweedfs-dev
    command:
      - "server"
      - "-ip=0.0.0.0"
      - "-ip.bind=0.0.0.0"
      - "-dir=/data"
      - "-s3"
      - "-s3.port=8333"
      - "-s3.config=/etc/seaweedfs/s3.json"
      - "-s3.allowedOrigins=http://localhost:3000,http://localhost:4000,http://localhost:5173"
    volumes:
      - seaweed-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      app-network:
        aliases:
          - s3.localhost
          - seaweedfs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  seaweedfs-init:
    image: amazon/aws-cli:2.22.35
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://s3.localhost:8333 s3 mb s3://"$${STORAGE_S3_BUCKET:-grab-media}" || true
        aws --endpoint-url http://s3.localhost:8333 s3api head-bucket --bucket "$${STORAGE_S3_BUCKET:-grab-media}"
    environment:
      AWS_ACCESS_KEY_ID: "${STORAGE_S3_ACCESS_KEY:-s3admin}"
      AWS_SECRET_ACCESS_KEY: "${STORAGE_S3_SECRET_KEY:-s3secret}"
      AWS_DEFAULT_REGION: "${STORAGE_S3_REGION:-us-east-1}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-grab-media}"
    networks:
      - app-network

networks:
  app-network:
    name: "${DOCKER_NETWORK:-grab-network}"
    driver: bridge

volumes:
  postgres-data:
    name: "${POSTGRES_VOLUME:-postgres-data}"
  pgadmin-data:
    name: "${PGADMIN_VOLUME:-pgadmin-data}"
  seaweed-data:
    name: "${SEAWEEDFS_VOLUME:-seaweed-data}"
  seller-auth-redis:
    name: "${SELLER_AUTH_REDIS_VOLUME:-seller-auth-redis}"
