      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]
    restart: unless-stopped

  channel-context-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: channel_context
      POSTGRES_USER: "${POSTGRES_USER:-admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123}"
    ports:
      - "${CHANNEL_CONTEXT_POSTGRES_PORT:-5435}:5432"
    volumes:
      - channel-context-data:/var/lib/postgresql/data
      - ./docker/postgres/init/channel-context.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d channel_context"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]
    restart: unless-stopped

  discovery-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discovery
      POSTGRES_USER: "${POSTGRES_USER:-admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123}"
    ports:
      - "${DISCOVERY_POSTGRES_PORT:-5436}:5432"
    volumes:
      - discovery-data:/var/lib/postgresql/data
      - ./docker/postgres/init/discovery.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d discovery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/postgres/servers.json:/pgadmin4/servers.json:ro
      - ./docker/postgres/.pgpass:/pgpass:ro
    depends_on:
      product-merchandising-db:
        condition: service_healthy
      order-management-db:
        condition: service_healthy
      identity-account-db:
        condition: service_healthy
      channel-context-db:
        condition: service_healthy
      discovery-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    profiles: ["storage"]
    command:
      - "server"
      - "-ip=0.0.0.0"
      - "-ip.bind=0.0.0.0"
      - "-dir=/data"
      - "-s3"
      - "-s3.port=8333"
      - "-s3.config=/etc/seaweedfs/s3.json"
      - "-s3.allowedOrigins=http://localhost:3000,http://localhost:4000,http://localhost:5173"
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweed-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      app-network:
        aliases:
          - s3.localhost
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  seaweedfs-init:
    image: amazon/aws-cli:2.22.35
    profiles: ["storage"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://s3.localhost:8333 s3 mb s3://"$${STORAGE_S3_BUCKET:-grab-media}" || true
        aws --endpoint-url http://s3.localhost:8333 s3api head-bucket --bucket "$${STORAGE_S3_BUCKET:-grab-media}"
    environment:
      AWS_ACCESS_KEY_ID: "${STORAGE_S3_ACCESS_KEY:-s3admin}"
      AWS_SECRET_ACCESS_KEY: "${STORAGE_S3_SECRET_KEY:-s3secret}"
      AWS_DEFAULT_REGION: "${STORAGE_S3_REGION:-us-east-1}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-grab-media}"
    networks:
      - app-network

networks:
  app-network:
    name: "${APP_DOCKER_NETWORK:-grab-app-dev-network}"
    driver: bridge

volumes:
  product-merchandising-data:
    name: "${PM_POSTGRES_VOLUME:-grab-app-dev-product-merchandising-data}"
  order-management-data:
    name: "${OM_POSTGRES_VOLUME:-grab-app-dev-order-management-data}"
  identity-account-data:
    name: "${IA_POSTGRES_VOLUME:-grab-app-dev-identity-account-data}"
  channel-context-data:
    name: "${CHANNEL_CONTEXT_POSTGRES_VOLUME:-grab-app-dev-channel-context-data}"
  discovery-data:
    name: "${DISCOVERY_POSTGRES_VOLUME:-grab-app-dev-discovery-data}"
  pgadmin-data:
    name: "${PGADMIN_VOLUME:-pgadmin-data}"
  seaweed-data:
    name: "${SEAWEEDFS_VOLUME:-seaweed-data}"
