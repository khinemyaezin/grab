  product-merchandising-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_merchandising
      POSTGRES_USER: "${POSTGRES_USER:-admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123}"
    ports:
      - "${PM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - product-merchandising-data:/var/lib/postgresql/data
      - ./docker/postgres/init/product-merchandising.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d product_merchandising"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]
    restart: unless-stopped

  order-management-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_management
      POSTGRES_USER: "${POSTGRES_USER:-admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123}"
    ports:
      - "${OM_POSTGRES_PORT:-5433}:5432"
    volumes:
      - order-management-data:/var/lib/postgresql/data
      - ./docker/postgres/init/order-management.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d order_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-network]
    restart: unless-stopped

