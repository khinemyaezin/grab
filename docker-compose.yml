      PM_DATASOURCE_PASSWORD: "${PM_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-123}}"
      PM_DATASOURCE_DRIVER_CLASS_NAME: "${PM_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}"
      PM_HIKARI_MAX_POOL_SIZE: "${PM_HIKARI_MAX_POOL_SIZE:-20}"
      PM_HIKARI_MIN_IDLE: "${PM_HIKARI_MIN_IDLE:-5}"
