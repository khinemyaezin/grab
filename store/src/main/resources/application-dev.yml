security:
  enabled: ${API_SECURITY:true}
  local-jwt:
    issuer: ${JWT_ISSUER:https://identity.local.grab}
    audience: ${JWT_AUDIENCE:grab-commerce-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
  api:
    cors: ${SECURITY_API_CORS:${SECURITY_API_CORES:*}}
    cores: ${SECURITY_API_CORES:* }
    cookie:
      secure: ${SECURITY_API_COOKIE_SECURE:false}
      same-site: ${SECURITY_API_COOKIE_SAME_SITE:Lax}
      refresh-token-max-age-days: ${SECURITY_API_COOKIE_REFRESH_TOKEN_MAX_AGE_DAYS:7}
      refresh-token-path: ${SECURITY_API_COOKIE_REFRESH_TOKEN_PATH:/api/v1/identity/auth/refresh}

logger:
  backend: ${LOGGER_BACKEND:slf4j}
  fail-on-missing-backend: ${LOGGER_FAIL_ON_MISSING_BACKEND:false}
  file:
    path: ${LOGGER_FILE_PATH:logs}
    name: ${LOGGER_FILE_NAME:store.log}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.web: ${LOGGING_LEVEL_WEB:INFO}

storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:8333}
    region: ${STORAGE_S3_REGION:us-east-1}
    bucket: ${STORAGE_S3_BUCKET:grab-media}
    access-key: ${STORAGE_S3_ACCESS_KEY:s3admin}
    secret-key: ${STORAGE_S3_SECRET_KEY:s3secret}
    public-base-url: ${STORAGE_S3_PUBLIC_BASE_URL:http://localhost:8333/grab-media}
    presign-ttl: ${STORAGE_S3_PRESIGN_TTL:PT15M}
    key-prefix: ${STORAGE_S3_KEY_PREFIX:}
  upload:
    max-size-bytes: ${STORAGE_UPLOAD_MAX_SIZE_BYTES:10485760}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
