product:
  datasource:
    url: jdbc:h2:mem:product;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.H2Dialect
      hbm2ddl:
        auto: create
      show_sql: true
      format_sql: true

logging:
  level:
    root: INFO
    org.springframework.web: TRACE
