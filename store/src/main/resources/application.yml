spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
catalog:
  datasource:
    url: ${CATALOG_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DATASOURCE_USERNAME:admin}
    password: ${CATALOG_DATASOURCE_PASSWORD:123}
    driver-class-name: ${CATALOG_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      dialect: ${CATALOG_DATASOURCE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
      hbm2ddl:
        auto: ${CATALOG_JPA_DDL_AUTO:update}
      show_sql: ${CATALOG_JPA_SHOW_SQL:true}
      format_sql: ${CATALOG_JPA_FORMAT_SQL:true }
  outbox:
    fixed-delay-ms: ${CATALOG_OUTBOX_FIXED_DELAY_MS:5000}
    cleanup-fixed-delay-ms: ${CATALOG_OUTBOX_CLEANUP_FIXED_DELAY_MS:300000}
    batch-size: ${CATALOG_OUTBOX_BATCH_SIZE:20}
    retry-delay-ms: ${CATALOG_OUTBOX_RETRY_DELAY_MS:30000}
    claim-timeout-ms: ${CATALOG_OUTBOX_CLAIM_TIMEOUT_MS:120000}
    retention-ms: ${CATALOG_OUTBOX_RETENTION_MS:604800000}

inventory:
  datasource:
    url: ${INVENTORY_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${INVENTORY_DATASOURCE_USERNAME:admin}
    password: ${INVENTORY_DATASOURCE_PASSWORD:123}
    driver-class-name: ${INVENTORY_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      dialect: ${INVENTORY_DATASOURCE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
      hbm2ddl:
        auto: ${INVENTORY_JPA_DDL_AUTO:update}
      show_sql: ${INVENTORY_JPA_SHOW_SQL:true}
      format_sql: ${INVENTORY_JPA_FORMAT_SQL:true }
  outbox:
    fixed-delay-ms: ${INVENTORY_OUTBOX_FIXED_DELAY_MS:5000}
    cleanup-fixed-delay-ms: ${INVENTORY_OUTBOX_CLEANUP_FIXED_DELAY_MS:300000}
    batch-size: ${INVENTORY_OUTBOX_BATCH_SIZE:20}
    retry-delay-ms: ${INVENTORY_OUTBOX_RETRY_DELAY_MS:30000}
    claim-timeout-ms: ${INVENTORY_OUTBOX_CLAIM_TIMEOUT_MS:120000}
    retention-ms: ${INVENTORY_OUTBOX_RETENTION_MS:604800000}

logger:
  backend: ${LOGGER_BACKEND:slf4j}
  level: ${LOGGER_LEVEL:INFO}
  fail-on-missing-backend: ${LOGGER_FAIL_ON_MISSING_BACKEND:false}
  file:
    path: ${LOGGER_FILE_PATH:logs}
    name: ${LOGGER_FILE_NAME:store.log}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
