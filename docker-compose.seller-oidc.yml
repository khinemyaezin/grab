services:
  authorization-server:
    profiles: [seller-oidc]
    build:
      context: .
      dockerfile: service/authorization-server/Dockerfile
    env_file:
      - docker/env/authorization-server.env
    environment:
      SELLER_AUTH_ACCOUNT_HOST: account-service
      AUTHORIZATION_REDIS_URL: redis://seller-auth-redis:6379
    depends_on:
      account-service:
        condition: service_started
      seller-auth-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTHORIZATION_PORT:-9000}:9000"
    networks: [app-network]
    volumes:
      - ${SELLER_OIDC_SECRETS_DIR:-./docker/secrets/seller-oidc}/issuer:/run/secrets/issuer:ro

  seller-auth-redis:
    profiles: [seller-oidc]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - seller-auth-redis:/data
    networks: [app-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  account-service:
    volumes:
      - ${SELLER_OIDC_SECRETS_DIR:-./docker/secrets/seller-oidc}/account:/run/secrets/seller-auth:ro

  seller-bff:
    volumes:
      - ${SELLER_OIDC_SECRETS_DIR:-./docker/secrets/seller-oidc}/bff:/run/secrets/seller-auth:ro
    environment:
      SELLER_AUTH_ACCOUNT_HOST: account-service
      SELLER_OIDC_BACKCHANNEL: http://authorization-server:9000
      SELLER_OIDC_REDIS_URL: redis://seller-auth-redis:6379

volumes:
  seller-auth-redis:
